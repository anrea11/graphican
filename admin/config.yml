# ------------------------------------------------------------------
#  Graphican — засварлах төвийн тохиргоо (Sveltia CMS)
#  ДООРХ "repo" мөрөнд өөрийн GitHub нэр/репо-гоо бичнэ.
#  Жишээ:  repo: graphican/graphican-site
# ------------------------------------------------------------------
backend:
  name: github
  repo: anrea11/graphican
  branch: main
  commit_messages:
    update: "Контент шинэчлэв: {{slug}}"
    uploadMedia: "Зураг нэмэв: {{path}}"
    deleteMedia: "Зураг устгав: {{path}}"

site_url: https://graphican.online
media_folder: assets/uploads
public_folder: /assets/uploads

# Зураг оруулахад автоматаар WebP болгож жижгэрүүлнэ (сайт хурдан ачаална)
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  - name: site
    label: "Сайтын контент"
    editor:
      preview: false
    files:
      # ---------------- HERO ----------------
      - name: content
        label: "Бүх контент"
        file: content/site.json
        format: json
        fields:
          - name: seo
            label: "SEO (Google-д харагдах)"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Хуудасны гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text }

          - name: hero
            label: "01 · Нүүр хэсэг (Hero)"
            widget: object
            fields:
              - name: kicker
                label: "Дээд жижиг шошго (англиар)"
                widget: list
                hint: "Жишээ: BRANDING, DIGITAL POSTER, REELS"
              - { name: title_line1, label: "Том гарчиг — 1-р мөр (англиар)", widget: string }
              - { name: title_line2, label: "Том гарчиг — 2-р мөр (англиар)", widget: string }
              - { name: tagline_line1, label: "Монгол уриа — 1-р мөр", widget: string }
              - { name: tagline_highlight, label: "Монгол уриа — өнгөтэй үг", widget: string, required: false }
              - { name: tagline_rest, label: "Монгол уриа — үлдсэн хэсэг", widget: string, required: false }
              - { name: description, label: "Тайлбар текст", widget: text }
              - { name: primary_button, label: "Үндсэн товч", widget: string }
              - { name: secondary_button, label: "Хоёр дахь товч", widget: string }
              - { name: artist_name, label: "Нэр", widget: string }
              - { name: artist_role, label: "Албан тушаал (англиар)", widget: string }
              - name: stats
                label: "Тоон үзүүлэлт"
                widget: list
                summary: "{{value}} — {{label}}"
                fields:
                  - { name: value, label: "Тоо", widget: string }
                  - { name: label, label: "Тайлбар", widget: string }
              - name: poster_main
                label: "Постер — голын том"
                widget: object
                fields: &poster
                  - { name: image, label: "Зураг (дөрвөлжин 1:1)", widget: image }
                  - { name: label, label: "Шошго (англиар)", widget: string, required: false }
                  - { name: alt, label: "Зургийн тайлбар", widget: string, required: false }
              - { name: poster_left, label: "Постер — зүүн", widget: object, fields: *poster }
              - { name: poster_right, label: "Постер — баруун", widget: object, fields: *poster }
              - { name: video, label: "Голын постерын оронд видео (заавал биш)", widget: file, required: false, accept: "video/mp4,video/webm", hint: "MP4 (H.264) хэлбэрээр export хийгээд 25MB-аас бага байлгана. Дуугүйгээр автоматаар тоглоно. Голын постерын зураг нь видео ачаалах хүртэл харагдана." }

          - name: marquee
            label: "Гүйдэг мөр (англиар)"
            widget: list

          # ---------------- WORK ----------------
          - name: work
            label: "02 · Ажлууд (Portfolio)"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text }
              - { name: hint, label: "Картын дээрх жижиг заавар", widget: string, required: false }
              - name: projects
                label: "Төслүүд"
                label_singular: "Төсөл"
                widget: list
                summary: "{{name}}"
                hint: "Чирж дарааллыг нь сольж болно. Шинэ төсөл нэмэх бол 'Add' дар."
                fields:
                  - { name: image, label: "Зураг (дөрвөлжин 1:1)", widget: image }
                  - { name: video, label: "Картын видео (заавал биш)", widget: file, required: false, accept: "video/mp4,video/webm", hint: "Оруулбал картан дээр зургийн оронд тоглоно. MP4 (H.264) хэлбэрээр export хийгээд 25MB-аас бага байлгана. Дуугүйгээр автоматаар тоглоно." }
                  - { name: name, label: "Брэнд / төслийн нэр", widget: string }
                  - { name: type, label: "Төрөл (англиар)", widget: string, hint: "Жишээ: BRANDING / DIGITAL POSTER" }
                  - { name: description, label: "Картын богино тайлбар", widget: text }
                  - { name: details, label: "Дэлгэрэнгүй тайлбар (дарахад гарна)", widget: text, required: false, hint: "Хоосон мөрөөр догол мөр тусгаарлана" }
                  - name: gallery
                    label: "Хийсэн ажлууд (дарахад гарна)"
                    label_singular: "Ажил"
                    widget: list
                    required: false
                    summary: "{{title}}"
                    hint: "Постер, лого, reels-ийн зураг бүрийг нэмээд доор нь тайлбар бичнэ"
                    fields:
                      - { name: image, label: "Зураг (видео бол нүүр зураг)", widget: image, required: false }
                      - { name: video, label: "Видео (заавал биш)", widget: file, required: false, accept: "video/mp4,video/webm", hint: "Видео оруулбал тоглуулагчтай гарна. MP4 (H.264) хэлбэрээр export хийгээд 25MB-аас бага байлгана. Дуугүйгээр автоматаар тоглоно." }
                      - { name: title, label: "Гарчиг", widget: string, required: false }
                      - { name: caption, label: "Тайлбар", widget: text, required: false }
                  - { name: link, label: "Холбоос (заавал биш)", widget: string, required: false, hint: "Behance, Instagram пост гэх мэт" }

          # ---------------- REELS / VIDEO ----------------
          - name: reels
            label: "03 · Видео ажлууд (Reels)"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text, required: false }
              - name: items
                label: "Видеонууд"
                label_singular: "Видео"
                widget: list
                required: false
                summary: "{{title}}"
                hint: "Чирж дарааллыг нь сольж болно. Шинэ видео нэмэх бол 'Add' дар."
                fields:
                  - { name: video, label: "Видео файл", widget: file, accept: "video/mp4,video/webm", hint: "MP4 (H.264) хэлбэрээр export хийгээд 25MB-аас бага байлгана. Дуугүйгээр автоматаар тоглоно." }
                  - { name: poster, label: "Нүүр зураг (заавал биш)", widget: image, required: false, hint: "Видео ачаалах хүртэл харагдана" }
                  - { name: title, label: "Гарчиг", widget: string }
                  - { name: type, label: "Төрөл (англиар)", widget: string, required: false, hint: "Жишээ: REELS, LOGO ANIMATION, MOTION POSTER" }
                  - { name: caption, label: "Тайлбар", widget: text, required: false }
                  - name: ratio
                    label: "Хэмжээ"
                    widget: select
                    default: "16:9"
                    options:
                      - { label: "Хэвтээ 16:9 (YouTube)", value: "16:9" }
                      - { label: "Босоо 9:16 (Reels, TikTok)", value: "9:16" }
                      - { label: "Дөрвөлжин 1:1", value: "1:1" }
                      - { label: "Босоо 4:5 (Instagram пост)", value: "4:5" }

          # ---------------- SERVICES ----------------
          - name: services
            label: "03 · Үйлчилгээ"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text }
              - name: items
                label: "Үйлчилгээнүүд"
                label_singular: "Үйлчилгээ"
                widget: list
                summary: "{{name}}"
                fields:
                  - { name: name, label: "Нэр (англиар)", widget: string }
                  - { name: name_mn, label: "Монгол нэр", widget: string }
                  - { name: description, label: "Тайлбар", widget: text }
                  - { name: tags, label: "Шошгууд", widget: list, required: false }

          # ---------------- ABOUT ----------------
          - name: about
            label: "04 · Миний тухай"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: photo, label: "Миний зураг (босоо 4:5)", widget: image, required: false }
              - { name: photo_label, label: "Зураг дээрх шошго (англиар)", widget: string, required: false }
              - { name: role, label: "Албан тушаал", widget: string, required: false }
              - { name: name, label: "Нэр", widget: string, required: false }
              - { name: name_en, label: "Нэр (англиар)", widget: string, required: false }
              - { name: title_line1, label: "Уриа — эхлэл", widget: string, required: false }
              - { name: title_highlight, label: "Уриа — өнгөтэй хэсэг", widget: string, required: false }
              - { name: title_line2, label: "Уриа — төгсгөл", widget: string, required: false }
              - { name: text, label: "Танилцуулга", widget: text, hint: "Хоосон мөрөөр догол мөр тусгаарлана" }
              - name: stats
                label: "Үзүүлэлтүүд (4 байвал сайхан)"
                widget: list
                summary: "{{value}} — {{label}}"
                fields:
                  - { name: value, label: "Тоо / үг", widget: string }
                  - { name: label, label: "Тайлбар", widget: string }

          # ---------------- CONTACT ----------------
          - name: contact
            label: "05 · Холбоо барих"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_line1, label: "Гарчиг — 1-р мөр", widget: string }
              - { name: title_line2, label: "Гарчиг — 2-р мөр", widget: string }
              - { name: text, label: "Тайлбар", widget: text }
              - { name: button, label: "Товчны текст", widget: string }
              - { name: email, label: "Имэйл", widget: string }
              - { name: phone, label: "Утас (заавал биш)", widget: string, required: false }
              - { name: big_text, label: "Арын том бичиг (англиар)", widget: string, required: false }
              - name: socials
                label: "Сошиал холбоос"
                widget: list
                summary: "{{name}}"
                hint: "Холбоосгүй үлдээсэн нь сайтад харагдахгүй"
                fields:
                  - { name: name, label: "Нэр", widget: string }
                  - { name: url, label: "Холбоос", widget: string, required: false }

          - name: footer
            label: "Footer"
            widget: object
            collapsed: true
            fields:
              - { name: copyright, label: "Зохиогчийн эрх", widget: string }
              - { name: tagline, label: "Уриа", widget: string }

      # ================= DESIGN PAGE (/design) =================
      - name: design
        label: "Дизайн хуудас (/design)"
        file: content/design.json
        format: json
        fields:
          - name: seo
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Хуудасны гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text }
          - name: hero
            label: "Нүүр хэсэг"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго (англиар)", widget: string }
              - { name: title_line1, label: "Том гарчиг — 1-р мөр", widget: string }
              - { name: title_line2, label: "Том гарчиг — 2-р мөр", widget: string }
              - { name: text, label: "Тайлбар", widget: text }
          - name: guide
            label: "01 · Визуал чиглэл (брэнд гайд)"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text, required: false }
              - { name: image, label: "Moodboard зураг", widget: image, required: false }
              - name: colors
                label: "Брэндийн өнгөнүүд"
                label_singular: "Өнгө"
                widget: list
                summary: "{{name}} — {{hex}}"
                fields:
                  - { name: name, label: "Нэр", widget: string }
                  - { name: hex, label: "HEX код", widget: string, hint: "Жишээ: #816DFB" }
                  - { name: role, label: "Хэрэглээ", widget: string, required: false }
          - name: fonts
            label: "02 · Фонтын хослолууд"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text, required: false }
              - name: groups
                label: "Бүлгүүд"
                label_singular: "Бүлэг"
                widget: list
                summary: "{{name}}"
                fields:
                  - { name: name, label: "Бүлгийн нэр", widget: string }
                  - { name: name_en, label: "Англи нэр", widget: string, required: false }
                  - name: items
                    label: "Хослолууд"
                    label_singular: "Хослол"
                    widget: list
                    summary: "{{heading}} + {{body}}"
                    fields:
                      - { name: heading, label: "Гарчгийн фонт", widget: string, hint: "Google Fonts дээрх нэрээр нь бичнэ (жишээ: Sora)" }
                      - { name: body, label: "Эх бичвэрийн фонт", widget: string }
                      - { name: desc, label: "Тайлбар", widget: text, required: false }
          - name: palettes
            label: "03 · Өнгөний хослолууд"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text, required: false }
              - name: items
                label: "Багцууд"
                label_singular: "Багц"
                widget: list
                summary: "{{name}}"
                hint: "Эхний өнгө = дэвсгэр, 2-р = текст, 3-р = акцент 1, 4-р = акцент 2"
                fields:
                  - { name: name, label: "Нэр", widget: string }
                  - name: colors
                    label: "Өнгөнүүд"
                    label_singular: "Өнгө"
                    widget: list
                    summary: "{{role}} — {{hex}}"
                    fields:
                      - { name: role, label: "Үүрэг", widget: string, hint: "Дэвсгэр / Текст / Акцент 1 / Акцент 2" }
                      - { name: hex, label: "HEX код", widget: string }
          - name: builder
            label: "04 · Нэг товшилтоор татах"
            widget: object
            fields:
              - { name: kicker, label: "Жижиг шошго", widget: string }
              - { name: title_en, label: "Англи гарчиг", widget: string, required: false }
              - { name: title, label: "Монгол гарчиг", widget: string }
              - { name: description, label: "Тайлбар", widget: text, required: false }
