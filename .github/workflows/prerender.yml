name: SEO prerender
# Keeps the crawlable HTML copy, meta tags, JSON-LD and sitemap in sync
# whenever content is edited (e.g. from /admin).
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/uploads/**'
      - '.github/scripts/prerender.py'
      - '.github/scripts/landings.py'
      - '.github/scripts/apps.py'
      - '.github/scripts/home_page.py'
      - '.github/scripts/chrome.py'
      - 'assets/design.js'
      - '.github/scripts/tpl_previews.py'
      - '.github/scripts/og.py'
      - 'worker/index.js'   # TRANSLATE_ON decides whether /tools/translate-pdf/ is linked and in the sitemap
      - 'assets/templates.js'
      - 'assets/mnfonts-data.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 .github/scripts/thumbs.py
      - name: Home page template previews (photo templates; skipped slots keep their fallback)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 .github/scripts/tpl_previews.py
      - run: python3 .github/scripts/prerender.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Commit if changed
        run: |
          git add -A assets/home index.html about design tools editor slides privacy terms support sitemap.xml assets/uploads/_t assets/uploads/og .github/scripts/lastmod.json
          if git diff --cached --quiet; then echo "nothing to update"; exit 0; fi
          git config user.name "graphican-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "SEO/thumbnails: автоматаар шинэчлэв"
          git push
